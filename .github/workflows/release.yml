name: Check and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...
      - run: go vet ./...
      - run: ./build.sh linux amd64 ci

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ./build.sh linux amd64 "$VERSION"
          cd build/linux-amd64
          sha256sum "wtr-display-linux-amd64-$VERSION" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --verify-tag \
            --title "WTR Display $VERSION" --notes-file docs/RELEASE-NOTES.md \
            "build/linux-amd64/wtr-display-linux-amd64-$VERSION" \
            build/linux-amd64/SHA256SUMS
